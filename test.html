<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat System Test</title>
    <link rel="stylesheet" href="chat.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .test-container {
            text-align: center;
            padding: 20px;
        }
        
        h1 {
            color: #4CAF50;
            margin-bottom: 20px;
        }
        
        .instructions {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            max-width: 600px;
        }
        
        .instructions h2 {
            color: #4CAF50;
            margin-top: 0;
        }
        
        .instructions ul {
            text-align: left;
            margin: 0;
            padding-left: 20px;
        }
        
        .instructions li {
            margin: 10px 0;
            color: #e0e0e0;
        }
        
        .key {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Chat System Test</h1>
        <div class="instructions">
            <h2>How to Test:</h2>
            <ul>
                <li>Press <span class="key">T</span> to toggle the chat window</li>
                <li>Press <span class="key">V</span> to toggle voice chat</li>
                <li>Type a message and press <span class="key">Enter</span> to send</li>
                <li>Try typing "hello" or "hi" to see the bot response</li>
                <li>Click outside the chat or press <span class="key">Escape</span> to close it</li>
            </ul>
        </div>
    </div>
    <script src="chat.js"></script>
</body>
</html>
